name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: micromouse
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: micromouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U micromouse -d micromouse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://micromouse:ci@localhost:5432/micromouse
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run coverage

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: micromouse
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: micromouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U micromouse -d micromouse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://micromouse:ci@localhost:5432/micromouse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      # o banco micromouse_e2e é criado e migrado pelo global-setup.ts
      - run: pip install -r requirements.txt
        working-directory: src/backend
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/e2e/package-lock.json
      - run: npm ci
        working-directory: src/frontend
      - run: npm ci
        working-directory: src/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: src/e2e
      - run: npx playwright test
        working-directory: src/e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/e2e/playwright-report/
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('src/firmware/platformio.ini') }}
      - run: pip install platformio gcovr
      - run: pio test -e native
      - run: gcovr -r . --filter lib/ .pio/build/native
      - run: pio run -e esp32dev
