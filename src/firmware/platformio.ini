; Firmware do Micromouse (ESP32-DEVKIT-V1)
;   pio run -e esp32dev       -> compila para o robô
;   pio test -e native        -> roda os testes no computador

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *
; ESP32 desta placa tem defeito na cache do nucleo 1 (bit trocado -> IllegalInstruction).
; Contorno: roda o Arduino (setup/loop) no nucleo 0. Trocar a ESP32 resolve de vez.
build_flags = -DARDUINO_RUNNING_CORE=0
build_src_filter = +<*> -<bancada/>
lib_deps =
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit BNO08x@^1.2.5
    links2004/WebSockets@^2.6.1

; Grava pelo Wi-Fi (OTA, RF22-S). O robô precisa estar ligado e na mesma rede.
;   set MICROMOUSE_OTA_SENHA=<a OTA_SENHA do credenciais.h>
;   pio run -e esp32dev_ota -t upload --upload-port <IP do robô>
; O ESP32 abre uma conexão de volta para o computador na porta 8266: libere-a
; no firewall do Windows (TCP, entrada) ou o envio fica parado em 0%.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = micromouse.local
upload_flags =
    --auth=${sysenv.MICROMOUSE_OTA_SENHA}
    --host_port=8266

; Testes de bancada (src/bancada/): pio run -e <nome> -t upload
[env:teste_i2c]
extends = env:esp32dev
build_src_filter = -<*> +<bancada/teste_i2c.cpp>

[env:teste_vl53]
extends = env:esp32dev
build_src_filter = -<*> +<bancada/teste_vl53.cpp>
lib_deps = pololu/VL53L0X@^1.3.1

[env:teste_bno]
extends = env:esp32dev
build_src_filter = -<*> +<bancada/teste_bno.cpp>
lib_deps = adafruit/Adafruit BNO08x@^1.2.5

[env:teste_encoder]
extends = env:esp32dev
build_src_filter = -<*> +<bancada/teste_encoder.cpp>

[env:native]
platform = native
test_framework = unity
build_flags = --coverage -D__STDC_FORMAT_MACROS
extra_scripts = post:cobertura.py

