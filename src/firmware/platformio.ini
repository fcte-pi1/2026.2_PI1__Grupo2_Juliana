; Firmware do Micromouse (ESP32-DEVKIT-V1)
;   pio run -e esp32dev       -> compila para o robô
;   pio test -e native        -> roda os testes no computador

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *
; ESP32 desta placa tem um bit da cache do nucleo 1 grudado em 0 (docs/7.3, 3.11 e 3.18).
; O Arduino (setup/loop) roda no nucleo 0. Trocar a ESP32 resolve de vez.
; Sem tabelas de switch: elas iriam para a flash mesmo em funcoes da IRAM (NUCLEO1).
build_flags = -DARDUINO_RUNNING_CORE=0 -fno-jump-tables -fno-tree-switch-conversion
lib_deps =
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit BNO08x@^1.2.5
    links2004/WebSockets@^2.6.1

[env:esp32dev]
extends = esp32
build_src_filter = +<*> -<bancada/>
; Funcoes que rodam no nucleo 1 (regex no nome C++). Depois de compilar, o
; nucleo1_verificar.py segue as chamadas a partir delas e falha a compilacao se
; alguma cair no bit defeituoso. Classes chamadas por metodo virtual entram aqui.
custom_nucleo1 = tarefaNavegacao RoboSimuladoNucleo1
extra_scripts = post:nucleo1_verificar.py

; Grava pelo Wi-Fi (OTA, RF22-S). O robô precisa estar ligado e na mesma rede.
;   set MICROMOUSE_OTA_SENHA=<a OTA_SENHA do credenciais.h>
;   pio run -e esp32dev_ota -t upload --upload-port <IP do robô>
; O ESP32 abre uma conexão de volta para o computador na porta 8266: libere-a
; no firewall do Windows (TCP, entrada) ou o envio fica parado em 0%.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = micromouse.local
upload_flags =
    --auth=${sysenv.MICROMOUSE_OTA_SENHA}
    --host_port=8266

; Testes de bancada (src/bancada/): pio run -e <nome> -t upload
[env:teste_i2c]
extends = esp32
build_src_filter = -<*> +<bancada/teste_i2c.cpp>

[env:teste_vl53]
extends = esp32
build_src_filter = -<*> +<bancada/teste_vl53.cpp>
lib_deps = pololu/VL53L0X@^1.3.1

[env:teste_bno]
extends = esp32
build_src_filter = -<*> +<bancada/teste_bno.cpp>
lib_deps = adafruit/Adafruit BNO08x@^1.2.5

[env:teste_encoder]
extends = esp32
build_src_filter = -<*> +<bancada/teste_encoder.cpp>

[env:teste_nucleo1]
extends = esp32
build_src_filter = -<*> +<bancada/teste_nucleo1.cpp>

[env:native]
platform = native
test_framework = unity
build_flags = --coverage -D__STDC_FORMAT_MACROS
extra_scripts = post:cobertura.py

